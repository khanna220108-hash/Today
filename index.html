<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<meta name="theme-color" content="#5b4bff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6f5;--card:#fbfaff;--ink:#1e1b33;--mute:#8a86a3;--line:#ebe8f7;--acc:#5b4bff;--acc2:#ff8a5c;--chip:#f1effc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1f1c3a;--ink:#f1efff;--mute:#8f8bb0;--line:#2c2950;--acc:#8b7dff;--acc2:#ff9a70;--chip:#28254a}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1f1c3a;--ink:#f1efff;--mute:#8f8bb0;--line:#2c2950;--acc:#8b7dff;--acc2:#ff9a70;--chip:#28254a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
.w{width:100%;max-width:380px;background:var(--card);border-radius:32px;padding:24px 22px 18px;box-shadow:0 24px 60px -20px rgba(60,40,160,.35)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.date{margin:6px 0 0;color:var(--mute);font-size:14px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .t{stroke:var(--chip)}
.ring .p{stroke:var(--acc);transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600}
.add{display:flex;gap:8px;margin:20px 0 14px;background:var(--chip);border-radius:18px;padding:6px 6px 6px 16px}
.add input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.add input::placeholder{color:var(--mute)}
.add button{width:40px;height:40px;border:0;border-radius:13px;background:var(--acc);color:#fff;font-size:24px;line-height:1;cursor:pointer;transition:transform .15s}
.add button:active{transform:scale(.92)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:7px 13px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
ul{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
li:last-child{border-bottom:0}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:14px;transition:all .2s}
.done .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.tx{flex:1;min-width:0;font-size:16px;line-height:1.3;word-break:break-word;cursor:pointer;transition:color .2s}
.done .tx{color:var(--mute);text-decoration:line-through}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;opacity:.55;padding:4px 6px;border-radius:8px}
.x:hover,.x:focus-visible{opacity:1;color:var(--acc2)}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.foot button{border:0;background:none;font:inherit;color:var(--acc);font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="w">
  <div class="top">
    <div><h1 id="hi">Today</h1><p class="date" id="date"></p></div>
    <div class="ring" aria-label="Progress">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle class="t" cx="32" cy="32" r="27"/><circle class="p" id="p" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <b id="pct">0%</b>
    </div>
  </div>
  <div class="add">
    <input id="in" placeholder="Add a task" maxlength="120" autocomplete="off" aria-label="New task">
    <button id="addb" aria-label="Add task">+</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">To do</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <div class="foot"><span id="left"></span><button id="clr">Clear done</button></div>
</main>
<script>
let tasks=[],filter='all';
try{tasks=JSON.parse(localStorage.getItem('todo-w')||'[]')}catch(e){}
if(!tasks.length&&!localStorage.getItem('todo-w')){tasks=[{id:1,t:'Plan the day',d:false},{id:2,t:'Drink some water',d:false},{id:3,t:'Tap a task to check it off',d:false}]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('todo-w',JSON.stringify(tasks))}catch(e){}};
const now=new Date(),h=now.getHours();
$('hi').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
$('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function render(){
  const done=tasks.filter(t=>t.d).length,total=tasks.length,pc=total?Math.round(done/total*100):0;
  $('p').style.strokeDashoffset=169.6*(1-pc/100);$('pct').textContent=pc+'%';
  const shown=tasks.filter(t=>filter==='all'||(filter==='done')===t.d);
  const ul=$('list');ul.innerHTML='';
  if(!shown.length){const e=document.createElement('div');e.className='empty';
    e.textContent=total?(filter==='done'?'Nothing done yet.':'All clear. Nice work.'):'No tasks yet. Add your first one above.';ul.appendChild(e)}
  shown.forEach(t=>{
    const li=document.createElement('li');if(t.d)li.className='done';
    const c=document.createElement('button');c.className='ck';c.textContent='✓';c.setAttribute('aria-label','Toggle '+t.t);c.onclick=()=>toggle(t.id);
    const s=document.createElement('span');s.className='tx';s.textContent=t.t;s.onclick=()=>toggle(t.id);
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Delete '+t.t);x.onclick=()=>{tasks=tasks.filter(k=>k.id!==t.id);save();render()};
    li.append(c,s,x);ul.appendChild(li)});
  const n=total-done;$('left').textContent=n?n+' left':(total?'All done':'');
  $('clr').style.visibility=done?'visible':'hidden';
}
function toggle(id){const t=tasks.find(k=>k.id===id);t.d=!t.d;save();render()}
function add(){const v=$('in').value.trim();if(!v)return;tasks.unshift({id:Date.now(),t:v,d:false});$('in').value='';save();render();$('in').focus()}
$('addb').onclick=add;$('in').onkeydown=e=>{if(e.key==='Enter')add()};
$('clr').onclick=()=>{tasks=tasks.filter(t=>!t.d);save();render()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  [...$('tabs').children].forEach(k=>k.setAttribute('aria-pressed',k===b));render()};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
